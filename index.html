<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#140C2E">
<title>Bingo Bango</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ---- the fix that cost an evening: flex beats [hidden] unless you say this */
[hidden] { display: none !important; }

:root{
  --ink:#140C2E;
  --ink-lift:#221645;
  --ink-line:#382A69;
  --cream:#FFF3DE;
  --hot:#FF3F6C;
  --lime:#C8F53C;
  --sky:#4CC9F0;
  --dim:#9C90C9;
  --pad: clamp(.9rem, 3.5vw, 1.6rem);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--ink);
  color:var(--cream);
  font-family:Archivo,system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.45;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.display{font-family:'Archivo Black',Archivo,sans-serif;font-weight:400;letter-spacing:-.015em;line-height:1.02;margin:0}
button,input{font:inherit;color:inherit}

#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.screen{
  flex:1;min-height:0;display:flex;flex-direction:column;
  padding:max(var(--pad), env(safe-area-inset-top)) var(--pad)
          max(var(--pad), env(safe-area-inset-bottom));
}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.centre{justify-content:center}

/* ---------- wordmark ---------- */
.mark{display:flex;align-items:baseline;gap:.35rem;margin-bottom:.2rem}
.mark span:first-child{font-family:'Archivo Black';font-size:clamp(2.4rem,11vw,4rem);color:var(--hot)}
.mark span:last-child{font-family:'Archivo Black';font-size:clamp(2.4rem,11vw,4rem);color:var(--lime)}
.sub{color:var(--dim);margin:.1rem 0 1.6rem;max-width:34ch}

/* ---------- controls ---------- */
.btn{
  display:block;width:100%;border:0;border-radius:14px;
  padding:.95rem 1.1rem;font-weight:700;font-size:1.05rem;
  background:var(--ink-lift);color:var(--cream);cursor:pointer;
  border:2px solid var(--ink-line);
}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn-go{background:var(--hot);border-color:var(--hot);color:#fff}
.btn-lime{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn-quiet{background:transparent;border-color:var(--ink-line);color:var(--dim);font-weight:600}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn + .btn{margin-top:.6rem}
.row{display:flex;gap:.6rem}
.row .btn{margin-top:0}

.field{display:block;margin-bottom:.9rem}
.field span{display:block;font-size:.82rem;color:var(--dim);margin-bottom:.35rem;font-weight:600}
.field input{
  width:100%;background:var(--ink-lift);border:2px solid var(--ink-line);
  border-radius:12px;padding:.85rem .95rem;
}
.field input:focus{outline:none;border-color:var(--sky)}

.code-in{
  font-family:'Archivo Black';font-size:1.6rem;letter-spacing:.35em;
  text-align:center;text-transform:uppercase;
}
.rule{display:flex;align-items:center;gap:.8rem;color:var(--dim);font-size:.8rem;margin:1.1rem 0}
.rule::before,.rule::after{content:"";flex:1;height:2px;background:var(--ink-line)}
.msg{color:var(--hot);font-weight:600;min-height:1.4em;margin:.6rem 0 0}

/* ---------- avatar ---------- */
.avatar-pick{display:flex;align-items:center;gap:1rem;margin-bottom:1.1rem}
.avatar-well{
  width:84px;height:84px;flex:none;border-radius:50%;
  background:var(--ink-lift);border:3px dashed var(--ink-line);
  display:grid;place-items:center;overflow:hidden;cursor:pointer;
  color:var(--dim);font-size:.7rem;text-align:center;padding:.4rem;
}
.avatar-well img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-well.has{border-style:solid;border-color:var(--lime)}

/* ---------- roster ---------- */
.code-chip{
  font-family:'Archivo Black';font-size:clamp(2rem,9vw,3rem);
  letter-spacing:.22em;color:var(--lime);
}
.kicker{color:var(--dim);font-size:.85rem;margin:0}
.h2{font-size:1.1rem;margin:1.5rem 0 .7rem}

.roster{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.7rem}
.who{
  display:flex;align-items:center;gap:.55rem;
  background:var(--ink-lift);border:2px solid var(--ink-line);
  border-radius:999px;padding:.3rem .85rem .3rem .3rem;
}
.who.off{opacity:.4}
.face{
  width:34px;height:34px;border-radius:50%;flex:none;overflow:hidden;
  display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--ink);
}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.who b{font-weight:700;font-size:.95rem}
.who .pts{color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums}
.crown{font-size:.8rem}

.swatches{display:flex;flex-wrap:wrap;gap:.5rem}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--cream)}
.sw[disabled]{opacity:.25}

/* ---------- game cards ---------- */
.games{display:grid;gap:.7rem}
.gcard{
  text-align:left;background:var(--ink-lift);border:2px solid var(--ink-line);
  border-radius:16px;padding:.9rem 1rem;cursor:pointer;color:inherit;
  display:flex;justify-content:space-between;align-items:center;gap:.8rem;
}
.gcard.on{border-color:var(--lime)}
.gcard strong{display:block;font-family:'Archivo Black';font-size:1.15rem}
.gcard em{display:block;font-style:normal;color:var(--dim);font-size:.88rem;margin-top:.15rem}
.votes{font-family:'Archivo Black';font-size:1.4rem;color:var(--lime);min-width:1.4em;text-align:right}
.clock{font-family:'Archivo Black';color:var(--hot);font-variant-numeric:tabular-nums}

/* ---------- scores ---------- */
.board{list-style:none;margin:0;padding:0}
.board li{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-bottom:2px solid var(--ink-line)}
.board .gain{margin-left:auto;font-family:'Archivo Black';color:var(--lime)}
.board .tot{color:var(--dim);font-variant-numeric:tabular-nums;font-size:.85rem}

/* ---------- banner: never a full screen scrim, iOS will strand it -------- */
#banner{
  position:fixed;left:0;right:0;top:0;z-index:60;
  padding:calc(env(safe-area-inset-top) + .7rem) 1rem .7rem;
  background:var(--sky);color:var(--ink);
  font-family:'Archivo Black';text-align:center;font-size:1.05rem;
  transform:translateY(-110%);transition:transform .22s ease;
  pointer-events:none;
}
#banner.up{transform:translateY(0)}
#banner.good{background:var(--lime)}
#banner.warn{background:var(--hot);color:#fff}

#gamehost{flex:1;min-height:0;display:flex;flex-direction:column}

.foot{display:flex;gap:.6rem;padding-top:.7rem}
.foot .btn{margin-top:0}
.dim{color:var(--dim)}
.tiny{font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="banner" role="status" aria-live="polite"></div>

<div id="app">

  <!-- ============ join ============ -->
  <section class="screen centre" id="s-join">
    <div class="scroll">
      <div class="mark"><span>Bingo</span><span>Bango</span></div>
      <p class="sub">One room, one code, a pile of small games. Everyone plays on their own phone.</p>

      <div class="avatar-pick">
        <button class="avatar-well" id="av-well" aria-label="Add your photo">Add a photo</button>
        <div>
          <label class="field" style="margin:0">
            <span>Your name</span>
            <input id="in-name" maxlength="16" autocomplete="off" placeholder="Sam">
          </label>
        </div>
      </div>
      <input type="file" id="av-file" accept="image/*" hidden>

      <button class="btn btn-go" id="b-create">Start a new room</button>
      <div class="rule"><span>or join one</span></div>
      <div class="row">
        <input id="in-code" class="code-in" style="flex:1;background:var(--ink-lift);border:2px solid var(--ink-line);border-radius:12px;padding:.7rem" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Room code">
        <button class="btn" id="b-join" style="width:auto;padding-inline:1.4rem">Join</button>
      </div>
      <p class="msg" id="join-msg"></p>
    </div>
  </section>

  <!-- ============ lobby ============ -->
  <section class="screen" id="s-lobby" hidden>
    <div class="scroll">
      <p class="kicker">Everyone opens this page and types</p>
      <div class="code-chip" id="lob-code">····</div>

      <h2 class="h2">Who's in</h2>
      <ul class="roster" id="lob-roster"></ul>

      <h2 class="h2">Your colour</h2>
      <div class="swatches" id="lob-swatches"></div>

      <h2 class="h2" id="lob-games-h">Pick a game</h2>
      <div class="games" id="lob-games"></div>

      <p class="kicker" id="lob-wait" style="margin-top:1rem">Waiting for the host.</p>
    </div>
    <div class="foot" id="lob-foot" hidden>
      <button class="btn btn-quiet" id="b-vote">Let everyone vote</button>
    </div>
  </section>

  <!-- ============ game ============ -->
  <section class="screen" id="s-game" hidden style="padding-left:0;padding-right:0">
    <div id="gamehost"></div>
  </section>

  <!-- ============ scores ============ -->
  <section class="screen" id="s-scores" hidden>
    <div class="scroll">
      <p class="kicker" id="sc-kicker">Round over</p>
      <h1 style="font-size:clamp(2rem,9vw,3rem);margin-bottom:1rem" id="sc-title">Scores</h1>
      <ul class="board" id="sc-board"></ul>
    </div>
    <div class="foot" id="sc-foot">
      <button class="btn btn-go" id="b-again">Back to the lobby</button>
    </div>
  </section>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
'use strict';

const $ = id => document.getElementById(id);
const socket = io({ transports: ['websocket', 'polling'] });

/* ---------- identity that survives an iOS tab suspension ---------- */
let token = null;
try { token = localStorage.getItem('bb.token'); } catch (e) {}
if (!token) {
  token = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
  try { localStorage.setItem('bb.token', token); } catch (e) {}
}
let myName = '';
let myAvatar = null;
try {
  myName = localStorage.getItem('bb.name') || '';
  myAvatar = localStorage.getItem('bb.avatar') || null;
} catch (e) {}

let state = null;
let skew = 0;                 // serverNow - Date.now()
let joinedCode = null;
const loadedGames = {};       // gameId -> module def
const pending = {};           // gameId -> true while its script loads
let mountedGame = null;

/* ---------- screens ---------- */
const SCREENS = { join: 's-join', lobby: 's-lobby', game: 's-game', scores: 's-scores' };
function show(which) {
  Object.entries(SCREENS).forEach(([k, id]) => { $(id).hidden = (k !== which); });
}

/* ---------- banner with a watchdog, because setTimeout dies in the background */
let bannerUntil = 0;
function banner(text, tone) {
  const el = $('banner');
  el.textContent = text;
  el.className = 'up ' + (tone || '');
  bannerUntil = Date.now() + 2600;
}
setInterval(() => {
  if (bannerUntil && Date.now() > bannerUntil) {
    bannerUntil = 0;
    $('banner').className = '';
  }
}, 250);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && bannerUntil && Date.now() > bannerUntil) {
    bannerUntil = 0; $('banner').className = '';
  }
});

/* ---------- avatar: shrink hard before it ever touches the wire ---------- */
$('av-well').addEventListener('click', () => $('av-file').click());
$('av-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (file) shrink(file).then(dataUrl => {
    myAvatar = dataUrl;
    try { localStorage.setItem('bb.avatar', dataUrl); } catch (err) {}
    paintAvatarWell();
    if (joinedCode) rejoin();
  }).catch(() => banner('That image would not load', 'warn'));
});

function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const S = 128;
      const c = document.createElement('canvas');
      c.width = S; c.height = S;
      const ctx = c.getContext('2d');
      const side = Math.min(img.width, img.height);          // square centre crop
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2,
                    side, side, 0, 0, S, S);
      URL.revokeObjectURL(url);
      let q = 0.72, out = c.toDataURL('image/jpeg', q);
      while (out.length > 40000 && q > 0.3) { q -= 0.12; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

function paintAvatarWell() {
  const well = $('av-well');
  if (myAvatar) {
    well.innerHTML = '';
    const im = new Image();
    im.src = myAvatar;
    im.alt = '';
    well.appendChild(im);
    well.classList.add('has');
  } else {
    well.textContent = 'Add a photo';
    well.classList.remove('has');
  }
}

function faceEl(p, size) {
  const d = document.createElement('div');
  d.className = 'face';
  d.style.background = p.colour;
  if (size) { d.style.width = d.style.height = size; }
  if (p.avatar) {
    const im = new Image();
    im.src = p.avatar; im.alt = '';
    d.appendChild(im);
  } else {
    d.textContent = (p.name || '?').slice(0, 1).toUpperCase();
  }
  return d;
}

/* ---------- joining ---------- */
$('in-name').value = myName;
paintAvatarWell();

function creds() {
  myName = $('in-name').value.trim() || myName || 'Player';
  try { localStorage.setItem('bb.name', myName); } catch (e) {}
  return { token: token, name: myName, avatar: myAvatar };
}

$('b-create').addEventListener('click', () => {
  if (!$('in-name').value.trim()) return fail('Put a name in first.');
  socket.emit('createRoom', creds(), res => {
    if (!res.ok) return fail(res.error);
    joinedCode = res.code;
  });
});

$('b-join').addEventListener('click', () => {
  const code = $('in-code').value.trim().toUpperCase();
  if (!$('in-name').value.trim()) return fail('Put a name in first.');
  if (code.length !== 4) return fail('Room codes are four letters.');
  socket.emit('joinRoom', Object.assign({ code: code }, creds()), res => {
    if (!res.ok) return fail(res.error);
    joinedCode = res.code;
  });
});

$('in-code').addEventListener('keydown', e => { if (e.key === 'Enter') $('b-join').click(); });
$('in-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('b-create').click(); });

function fail(msg) { $('join-msg').textContent = msg || 'That did not work.'; }

function rejoin() {
  if (!joinedCode) return;
  socket.emit('joinRoom', Object.assign({ code: joinedCode }, creds()), res => {
    if (!res.ok) { joinedCode = null; show('join'); fail(res.error); }
  });
}

socket.on('connect', () => { if (joinedCode) rejoin(); });
socket.on('kicked', () => {
  joinedCode = null; state = null; show('join');
  fail('The host removed you from that room.');
});
socket.on('banner', m => banner(m.text, m.tone));

/* ---------- the mini game bridge ---------- */
const api = {
  send: (type, payload) => socket.emit('game', { type: type, payload: payload }),
  banner: banner,
  serverNow: () => Date.now() + skew,
  get me() { return state ? state.you : null; },
  get players() { return state ? state.players : []; },
  get isHost() { return state ? state.you === state.hostId : false; },
  get hostId() { return state ? state.hostId : null; },
  player(id) { return (state ? state.players : []).find(p => p.id === id) || null; },
  faceEl: faceEl,
};

window.BingoBango = {
  registerGame(def) {
    loadedGames[def.id] = def;
    delete pending[def.id];
    if (state && state.phase === 'game' && state.gameId === def.id) mountGame(def.id);
  },
};

function ensureGame(id) {
  if (loadedGames[id] || pending[id]) return;
  pending[id] = true;
  const sc = document.createElement('script');
  sc.src = '/games/' + id + '.js?v=6';
  sc.onerror = () => { delete pending[id]; banner('Could not load that game', 'warn'); };
  document.head.appendChild(sc);
}

function mountGame(id) {
  const def = loadedGames[id];
  if (!def) return;
  if (mountedGame && mountedGame.id !== id) unmountGame();
  if (!mountedGame) {
    $('gamehost').innerHTML = '';
    def.mount($('gamehost'), api);
    mountedGame = def;
  }
  if (state && state.game) def.render(state.game, api);
}

function unmountGame() {
  if (mountedGame && mountedGame.unmount) { try { mountedGame.unmount(); } catch (e) {} }
  mountedGame = null;
  $('gamehost').innerHTML = '';
}

/* ---------- render ---------- */
socket.on('state', s => {
  state = s;
  skew = s.serverNow - Date.now();
  if (s.phase === 'game' && s.gameId) {
    show('game');
    ensureGame(s.gameId);
    mountGame(s.gameId);
    return;
  }
  if (mountedGame) unmountGame();
  if (s.phase === 'scores') { show('scores'); renderScores(s); return; }
  show('lobby');
  renderLobby(s);
});

function renderLobby(s) {
  $('lob-code').textContent = s.code;

  const roster = $('lob-roster');
  roster.innerHTML = '';
  s.players.forEach(p => {
    const li = document.createElement('li');
    li.className = 'who' + (p.connected ? '' : ' off');
    li.appendChild(faceEl(p));
    const b = document.createElement('b');
    b.textContent = p.name + (p.id === s.you ? ' (you)' : '');
    li.appendChild(b);
    if (p.isHost) { const c = document.createElement('span'); c.className = 'crown'; c.textContent = '★'; li.appendChild(c); }
    if (p.score) { const t = document.createElement('span'); t.className = 'pts'; t.textContent = p.score; li.appendChild(t); }
    roster.appendChild(li);
  });

  const mine = s.players.find(p => p.id === s.you);
  const taken = s.players.filter(p => p.id !== s.you).map(p => p.colour);
  const sw = $('lob-swatches');
  sw.innerHTML = '';
  ['#FF4D6D','#C6F135','#4CC9F0','#FFB01F','#B47CFF','#3DDC97','#FF7A45','#F5F1E6','#7A8BFF','#FF61C7','#59E3C5','#FFE066']
    .forEach(c => {
      const b = document.createElement('button');
      b.className = 'sw' + (mine && mine.colour === c ? ' on' : '');
      b.style.background = c;
      b.disabled = taken.indexOf(c) > -1;
      b.setAttribute('aria-label', 'Choose this colour');
      b.onclick = () => socket.emit('setColour', c);
      sw.appendChild(b);
    });

  const host = s.you === s.hostId;
  const voting = !!s.vote;
  $('lob-foot').hidden = !host || voting;
  $('lob-wait').hidden = host || voting;
  $('lob-games-h').textContent = voting ? 'Vote for a game'
    : host ? 'Pick a game' : 'Tonight’s games';

  const wrap = $('lob-games');
  wrap.innerHTML = '';
  s.games.forEach(g => {
    const card = document.createElement('button');
    card.className = 'gcard' + (voting && s.vote.mine === g.id ? ' on' : '');
    const txt = document.createElement('div');
    const strong = document.createElement('strong'); strong.textContent = g.name;
    const em = document.createElement('em');
    em.textContent = g.tagline + (s.players.filter(p => p.connected).length < g.minPlayers
      ? ' · needs ' + g.minPlayers + ' players' : '');
    txt.appendChild(strong); txt.appendChild(em);
    card.appendChild(txt);

    if (voting) {
      const n = document.createElement('div');
      n.className = 'votes';
      n.textContent = s.vote.tally[g.id] || '';
      card.appendChild(n);
      card.onclick = () => socket.emit('castVote', g.id);
    } else if (host) {
      card.onclick = () => socket.emit('pickGame', g.id);
    } else {
      card.disabled = true;
      card.style.cursor = 'default';
    }
    wrap.appendChild(card);
  });

  if (voting) {
    const p = document.createElement('p');
    p.className = 'kicker';
    p.style.marginTop = '.8rem';
    p.innerHTML = 'Voting closes in <span class="clock" id="vote-clock"></span>';
    wrap.appendChild(p);
    if (host) {
      const b = document.createElement('button');
      b.className = 'btn btn-quiet';
      b.style.marginTop = '.8rem';
      b.textContent = 'Close the vote now';
      b.onclick = () => socket.emit('closeVote');
      wrap.appendChild(b);
    }
  }
}

$('b-vote').addEventListener('click', () => socket.emit('openVote'));
$('b-again').addEventListener('click', () => socket.emit('backToLobby'));

/* Countdowns are computed from a server timestamp every tick, so a suspended
   tab catches up the moment it wakes instead of finishing late. */
setInterval(() => {
  const el = $('vote-clock');
  if (!el || !state || !state.vote) return;
  const left = Math.max(0, Math.ceil((state.vote.endsAt - (Date.now() + skew)) / 1000));
  el.textContent = left + 's';
}, 250);

function renderScores(s) {
  const r = s.lastRound;
  $('sc-kicker').textContent = r ? r.gameName + ' — round over' : 'Round over';
  const board = $('sc-board');
  board.innerHTML = '';

  const totals = {};
  s.players.forEach(p => { totals[p.id] = p.score; });
  const rows = (r && r.scores.length) ? r.scores
    : s.players.map(p => ({ id: p.id, name: p.name, colour: p.colour, avatar: p.avatar, points: 0 }));

  rows.forEach(row => {
    const p = s.players.find(x => x.id === row.id) || row;
    const li = document.createElement('li');
    li.appendChild(faceEl(p));
    const nm = document.createElement('b'); nm.textContent = p.name;
    li.appendChild(nm);
    const tot = document.createElement('span'); tot.className = 'tot';
    tot.textContent = (totals[row.id] || 0) + ' total';
    li.appendChild(tot);
    const g = document.createElement('span'); g.className = 'gain';
    g.textContent = row.points > 0 ? '+' + row.points : '—';
    li.appendChild(g);
    board.appendChild(li);
  });

  const host = s.you === s.hostId;
  $('b-again').disabled = !host;
  $('b-again').textContent = host ? 'Back to the lobby' : 'Waiting for the host';
}

show('join');
})();
</script>
</body>
</html>
